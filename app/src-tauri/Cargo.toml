[package]
name = "comfyui-mac"
version = "0.1.0"
edition = "2021"
description = "Native window + lifecycle wrapper for a local ComfyUI install"

[lib]
name = "comfyui_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
