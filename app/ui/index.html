<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>ComfyUI</title>
<style>
:root{--bg:#0f0f10;--fg:#e7e5e4;--muted:#a8a29e;--accent:#2dd4bf;--err:#fca5a5}
@media (prefers-color-scheme:light){:root{--bg:#fafaf9;--fg:#1c1917;--muted:#57534e;--accent:#0f766e;--err:#b91c1c}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,system-ui,sans-serif}
main{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;box-sizing:border-box}
h1{font-size:1.4rem;margin:0}
.spin{width:28px;height:28px;border:3px solid var(--muted);border-top-color:var(--accent);border-radius:50%;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#msg{color:var(--muted);text-align:center;white-space:pre-wrap}
#msg.err{color:var(--err)}
pre{width:min(900px,100%);max-height:40vh;overflow:auto;margin:0;padding:12px;border-radius:8px;background:rgba(127,127,127,.12);font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap}
small{color:var(--muted)}
</style></head>
<body><main>
<div class="spin" id="spin"></div>
<h1>ComfyUI 啟動中…</h1>
<div id="msg">正在啟動伺服器，第一次載入模型可能需要 1–3 分鐘。</div>
<pre id="log"></pre>
<small>伺服器就緒後會自動切換；也可以用瀏覽器開 http://127.0.0.1:8188 · Server ▸ Show Log Window 看完整輸出</small>
</main>
<script>
const inv=(c,a)=>window.__TAURI__.core.invoke(c,a), pre=document.getElementById('log');
const add=l=>{pre.textContent=(pre.textContent+l+'\n').split('\n').slice(-30).join('\n');pre.scrollTop=pre.scrollHeight};
inv('get_log').then(ls=>ls.slice(-30).forEach(add));
window.__TAURI__.event.listen('server-log',e=>add(e.payload));
window.__TAURI__.event.listen('server-failed',e=>{document.getElementById('spin').style.display='none';const m=document.getElementById('msg');m.className='err';m.textContent=e.payload});
inv('get_status').then(s=>{if(s.external){document.getElementById('msg').textContent='偵測到 127.0.0.1:8188 已有 ComfyUI 在跑，正在接上（外部伺服器，離開時不會關閉它）。'}});
</script></body></html>
